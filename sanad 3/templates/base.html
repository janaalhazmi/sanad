<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>{% block title %}سَند{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body class="{{ '' if show_nav else 'no-bottom-nav' }}">
<script>window.SANAD_PAGE = "{{ active or 'unknown' }}";</script>
<div class="app-shell">
  {% block content %}{% endblock %}

  {% if show_nav %}
  <nav class="bottom-nav">
    <a href="/dashboard" class="{{ 'active' if active=='dashboard' else '' }}">
      <span class="nav-icon">🏠</span>الرئيسية
    </a>
    <a href="/transactions-page" class="{{ 'active' if active=='transactions' else '' }}">
      <span class="nav-icon">🧾</span>العمليات
    </a>
    <a href="/assistant" class="fab" title="المساعد الصوتي">🎙️</a>
    <a href="/transfer" class="{{ 'active' if active=='transfer' else '' }}">
      <span class="nav-icon">💸</span>تحويل
    </a>
    <a href="/settings" class="{{ 'active' if active=='settings' else '' }}">
      <span class="nav-icon">⚙️</span>الإعدادات
    </a>
  </nav>
  {% endif %}

  {% if not hide_global_assistant %}
  <div class="global-assistant-cluster">
    <button class="global-assistant-btn" id="globalAssistantRead" title="اقرأ محتوى الشاشة">🔊</button>
    <button class="global-assistant-btn" id="globalAssistantMic" title="تحدث للمساعد">🎙️</button>
  </div>
  {% endif %}
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/webauthn.js') }}"></script>
{% if not hide_global_assistant %}
<script src="{{ url_for('static', filename='js/global_assistant.js') }}"></script>
{% endif %}
{% block extra_scripts %}{% endblock %}
</body>
</html>
